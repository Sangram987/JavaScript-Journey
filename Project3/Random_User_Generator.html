<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random User Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
            padding: 20px;
        }

        h2 {
            color: #1e293b;
            margin-bottom: 20px;
            font-size: 2rem;
            text-align: center;
        }

        button {
            background-color: #6366f1;
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            transition: all 0.2s ease;
            margin-bottom: 24px;
        }

        button:hover {
            background-color: #4f46e5;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        /* Card container styling when content is injected */
        #user:not(:empty) {
            background-color: #ffffff;
            padding: 32px 28px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 340px;
            text-align: center;
            animation: fadeIn 0.3s ease-in-out;
        }

        /* Profile Image */
        #user img {
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #e0e7ff;
            margin-bottom: 16px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        /* Full Name */
        #user h3 {
            color: #0f172a;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        /* Email */
        #user p:first-of-type {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 12px;
            word-break: break-all;
        }

        /* Country Badge */
        #user p:last-of-type {
            color: #4338ca;
            background-color: #e0e7ff;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.03em;
            padding: 6px 16px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <h2>Random User Generator</h2>
    <button onclick="loadUser()">Generate User</button>
    <div id="user"></div>

    <script>
        async function loadUser() {
            const res = await fetch("https://randomuser.me/api/");
            const data = await res.json();
            const user = data.results[0];
            document.getElementById("user").innerHTML = ` 
                <img src="${user.picture.large}" width="120"> 
                <h3>${user.name.first} ${user.name.last}</h3> 
                <p>${user.email}</p> 
                <p>${user.location.country}</p>
            `;
        }
    </script>
</body>

</html>
