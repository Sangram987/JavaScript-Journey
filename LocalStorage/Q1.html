<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>store an array of colors in localStorage.</title>
</head>
<body>
    <script>
        const colors = [
            "black",
            "white",
            "red",
            "blue",
            "green"
        ]

        localStorage.setItem("colors" , JSON.stringify(colors));
    </script>
</body>
</html>
