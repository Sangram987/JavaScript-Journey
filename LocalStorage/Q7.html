<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save notes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f4f8;
            color: #102a43;
            padding: 20px;
        }

        .note-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border: 1px solid #bcccdc;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 14px rgba(16, 42, 67, 0.08);
            text-align: center;
        }

        h2 {
            font-size: 1.5rem;
            color: #0b69a3;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #bcccdc;
            border-radius: 6px;
            outline: none;
            font-size: 0.95rem;
            margin-bottom: 16px;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #0b69a3;
            box-shadow: 0 0 0 3px rgba(11, 105, 163, 0.15);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #0b69a3;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #084e79;
        }

        #output:not(:empty) {
            margin-top: 20px;
            background-color: #e0f2fe;
            border: 1px solid #bae6fd;
            border-left: 4px solid #0b69a3;
            padding: 14px;
            border-radius: 4px;
            font-size: 0.95rem;
            color: #0369a1;
            text-align: left;
            word-break: break-all;
        }
    </style>
</head>

<body>

    <div class="note-card">
        <h2>Note Saver</h2>
        <input id="note" placeholder="Write note">
        <button onclick="saveNote()">Save</button>
        <p id="output"></p>
    </div>

    <script>
        // Runs on page refresh to keep saved data visible
        let savedNote = localStorage.getItem("notes");
        if (savedNote) {
            document.getElementById("output").innerHTML = `The note is ${savedNote}`;
        }

        function saveNote() {
            let note = document.getElementById("note").value;
            let data = document.getElementById("output");

            let loc = localStorage.setItem("notes", JSON.stringify(note));

            let get = localStorage.getItem("notes");
            console.log(get);

            data.innerHTML = `The note is ${get}`;
        }
    </script>
</body>

</html>
