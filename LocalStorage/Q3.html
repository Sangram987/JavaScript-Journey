<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store an object containing name, age, and city in localStorage.</title>
</head>
<body>
    <script>
        const obj = {
            name: "Sangram",
            age: 19,
            city: "Jajpur"
        }

        localStorage.setItem("obj" , JSON.stringify(obj))
    </script>
</body>
</html>
