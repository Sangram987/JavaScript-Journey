<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Water Gun Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a40 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 20px;
            color: #4deeea;
            text-shadow: 0 0 10px rgba(77, 238, 234, 0.3);
        }

        .container {
            background-color: #252538;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid #383854;
        }

        h2 {
            font-size: 1.8rem;
            color: #ffe600;
            margin-bottom: 8px;
        }

        .container>p {
            color: #a0a0c0;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="text"] {
            padding: 12px 16px;
            border-radius: 8px;
            border: 2px solid #383854;
            background-color: #1a1a28;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #74ee15;
        }

        button {
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(90deg, #ff007f, #7928ca);
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 0, 127, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        #data {
            margin-top: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1a1a28;
            border-radius: 8px;
            padding: 10px;
            border: 1px dashed #383854;
        }
    </style>
</head>

<body>
    <h1>Welcome to the Game</h1>
    <div class="container">
        <h2>Snake Water Gun</h2>
        <p>Play and enjoy!</p>
        <form class="form" onsubmit="event.preventDefault(); match();">
            <input type="text" placeholder="Enter snake, water, or gun" id="input">
            <button type="button" id="btn" onclick="match()">Result</button>
        </form>
        <p id="data">Wait for result!</p>
    </div>

    <script>
        const match = () => {
            const userInput = document.getElementById("input").value.trim().toLowerCase();
            const resultBox = document.getElementById("data");

            if (!userInput || !["snake", "water", "gun"].includes(userInput)) {
                resultBox.style.color = "#ff4d4d";
                resultBox.innerHTML = "Please enter 'snake', 'water', or 'gun'";
                return;
            }

            const choices = ["snake", "water", "gun"];
            const cpu = choices[Math.floor(Math.random() * 3)];

            if (userInput === cpu) {
                resultBox.style.color = "#ffe600";
                resultBox.innerHTML = `Tie! CPU choose- <b>${cpu}</b>.`;
            } else if (
                (userInput === "snake" && cpu === "water") ||
                (userInput === "water" && cpu === "gun") ||
                (userInput === "gun" && cpu === "snake")
            ) {
                resultBox.style.color = "#74ee15";
                resultBox.innerHTML = `You Win! CPU choose- <b>${cpu}</b>.`;
            } else {
                resultBox.style.color = "#ff4d4d";
                resultBox.innerHTML = `CPU Wins! CPU choose- <b>${cpu}</b>.`;
            }
        };
    </script>
</body>

</html>
