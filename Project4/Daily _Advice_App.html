<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Advice</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            padding: 20px;
            text-align: center;
        }

        h2 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: #f1f5f9;
            letter-spacing: -0.5px;
        }

        button {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #ffffff;
            border: none;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
            transition: all 0.25s ease;
            margin-bottom: 32px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.45);
            background: linear-gradient(135deg, #7dd3fc 0%, #0369a1 100%);
        }

        button:active {
            transform: translateY(0);
        }

        /* Advice Text Styling */
        #advice {
            max-width: 500px;
            font-size: 1.25rem;
            line-height: 1.6;
            color: #e2e8f0;
            font-style: italic;
            transition: all 0.3s ease;
        }

        /* Displays styling when advice content is injected */
        #advice:not(:empty) {
            background-color: rgba(255, 255, 255, 0.05);
            border-left: 4px solid #38bdf8;
            padding: 20px 24px;
            border-radius: 0 12px 12px 0;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            animation: fadeIn 0.4s ease-out;
        }

        #advice:not(:empty)::before {
            content: "“";
            font-size: 1.8rem;
            color: #38bdf8;
            margin-right: 6px;
            vertical-align: -0.1em;
            line-height: 0;
        }

        #advice:not(:empty)::after {
            content: "”";
            font-size: 1.8rem;
            color: #38bdf8;
            margin-left: 6px;
            vertical-align: -0.1em;
            line-height: 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <h2>Daily Advice</h2>
    <button onclick="getAdvice()">Get Advice</button>
    <p id="advice"></p>

    <script>
        async function getAdvice() {
            const res = await fetch("https://api.adviceslip.com/advice");
            const data = await res.json();
            document.getElementById("advice").innerText = data.slip.advice;
        }
    </script>
</body>

</html>
