<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalStorage Task Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f4f8;
            color: #102a43;
            padding: 20px;
        }

        .tracker-card {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            border: 1px solid #bcccdc;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 10px 25px rgba(16, 42, 67, 0.08);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 1.5rem;
            color: #0b69a3;
        }

        .count-badge {
            background-color: #e0f2fe;
            color: #0369a1;
            font-size: 0.85rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #bcccdc;
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #0b69a3;
            box-shadow: 0 0 0 3px rgba(11, 105, 163, 0.15);
        }

        .btn-add {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background-color: #0b69a3;
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-add:hover {
            background-color: #084e79;
        }

        .task-list {
            list-style: none;
            max-height: 280px;
            overflow-y: auto;
            margin-bottom: 16px;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        .task-item.completed {
            background-color: #f1f5f9;
            opacity: 0.7;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #64748b;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            flex: 1;
        }

        .task-left input[type="checkbox"] {
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: #0b69a3;
        }

        .task-text {
            font-size: 0.95rem;
            word-break: break-all;
        }

        .btn-delete {
            background: transparent;
            border: none;
            color: #ef4444;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .btn-delete:hover {
            background-color: #fee2e2;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid #e2e8f0;
        }

        .btn-clear {
            background: none;
            border: none;
            color: #64748b;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: underline;
        }

        .btn-clear:hover {
            color: #ef4444;
        }

        .empty-state {
            text-align: center;
            color: #94a3b8;
            font-size: 0.9rem;
            padding: 20px 0;
        }
    </style>
</head>

<body>

    <div class="tracker-card">
        <div class="header">
            <h2>Task Tracker</h2>
            <span class="count-badge" id="taskCount">0 Tasks</span>
        </div>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Add a new task..." onkeypress="handleKeyPress(event)">
            <button class="btn-add" onclick="addTask()">Add</button>
        </div>

        <ul class="task-list" id="taskList"></ul>

        <div class="footer">
            <span style="font-size: 0.85rem; color: #64748b;" id="completedCount">0 completed</span>
            <button class="btn-clear" onclick="clearAll()">Clear All</button>
        </div>
    </div>

    <script>
        // 1. Initialize tasks array from LocalStorage
        let tasks = JSON.parse(localStorage.getItem("tracker_tasks")) || [];

        // Render existing tasks on initial load
        document.addEventListener("DOMContentLoaded", renderTasks);

        // 2. Add a new task
        function addTask() {
            const input = document.getElementById("taskInput");
            const text = input.value.trim();

            if (!text) return;

            const newTask = {
                id: Date.now(),
                text: text,
                completed: false
            };

            tasks.push(newTask);
            saveToLocalStorage();
            renderTasks();

            input.value = "";
            input.focus();
        }

        // 3. Toggle completed state
        function toggleTask(id) {
            tasks = tasks.map(task => {
                if (task.id === id) {
                    return { ...task, completed: !task.completed };
                }
                return task;
            });

            saveToLocalStorage();
            renderTasks();
        }

        // 4. Delete single task
        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveToLocalStorage();
            renderTasks();
        }

        // 5. Clear all tasks from array & LocalStorage
        function clearAll() {
            if (tasks.length === 0) return;
            tasks = [];
            localStorage.removeItem("tracker_tasks");
            renderTasks();
        }

        // 6. Save current tasks array to LocalStorage
        function saveToLocalStorage() {
            localStorage.setItem("tracker_tasks", JSON.stringify(tasks));
        }

        // 7. Render tasks dynamically into HTML
        function renderTasks() {
            const listElement = document.getElementById("taskList");
            listElement.innerHTML = "";

            if (tasks.length === 0) {
                listElement.innerHTML = `<li class="empty-state">No tasks found. Add one above!</li>`;
            } else {
                tasks.forEach(task => {
                    const li = document.createElement("li");
                    li.className = `task-item ${task.completed ? "completed" : ""}`;

                    li.innerHTML = `
                        <div class="task-left" onclick="toggleTask(${task.id})">
                            <input type="checkbox" ${task.completed ? "checked" : ""} onclick="event.stopPropagation(); toggleTask(${task.id})">
                            <span class="task-text"></span>
                        </div>
                        <button class="btn-delete" onclick="deleteTask(${task.id})">&times;</button>
                    `;

                    // Safely set text content to prevent XSS
                    li.querySelector(".task-text").textContent = task.text;
                    listElement.appendChild(li);
                });
            }

            // Update status counters
            const completed = tasks.filter(t => t.completed).length;
            document.getElementById("taskCount").innerText = `${tasks.length} ${tasks.length === 1 ? 'Task' : 'Tasks'}`;
            document.getElementById("completedCount").innerText = `${completed} of ${tasks.length} completed`;
        }

        function handleKeyPress(e) {
            if (e.key === "Enter") addTask();
        }
    </script>

</body>

</html>
